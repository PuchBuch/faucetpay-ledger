[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faucetpay-ledger"
version = "0.2.0"
description = "Read-only FaucetPay tool for faucet owners: payout statistics, low-balance alerts, monthly reports in EUR."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
fpl = "faucetpay_ledger.cli:main"

[tool.setuptools]
packages = ["faucetpay_ledger"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
