[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faucetpay-ledger"
version = "0.1.0"
description = "Read-only FaucetPay balance tracker: daily snapshots, monthly earnings report in EUR, CSV export."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
fpl = "faucetpay_ledger.cli:main"

[tool.setuptools]
packages = ["faucetpay_ledger"]
